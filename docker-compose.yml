services:
  orca:
    image: ghcr.io/washingtonj/orca-devcontainer:latest
    restart: unless-stopped

    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1

    ports:
      - "${SSH_HOST_BIND:-127.0.0.1}:${SSH_HOST_PORT:-2222}:22"
    expose:
      - "6768"

    environment:
      ORCA_PORT: "6768"
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:?Set ORCA_PAIRING_ADDRESS in .env}
      ORCA_JSON: ${ORCA_JSON:-0}
      ORCA_MOBILE_PAIRING: ${ORCA_MOBILE_PAIRING:-0}
      ORCA_NO_SANDBOX: ${ORCA_NO_SANDBOX:-0}
      LIBGL_ALWAYS_SOFTWARE: "1"

    volumes:
      - orca-home:/home/agent

    security_opt:
      - seccomp:unconfined

    shm_size: "1gb"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6768'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Optional: peer-to-peer sync between this host and a local client, used to
  # keep agent skills and related config in sync across machines. Start it only
  # if you want that; `docker compose up -d orca` skips it. The profile keeps
  # the default `docker compose up -d` from launching it implicitly.
  syncthing:
    image: syncthing/syncthing
    restart: unless-stopped
    network_mode: host
    profiles: ["sync"]

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5

    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: "${SYNCTHING_GUI_ADDRESS:-0.0.0.0:8384}"
      STHOMEDIR: "/home/agent/.config/syncthing"

    volumes:
      - orca-home:/home/agent

volumes:
  orca-home:
